<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陪伴机器人</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --line: #e2e5ea; --text: #1f2430; --muted: #5d6676;
    --accent: #2f6fed; --accent-text: #fff; --user: #dbe8ff; --bot: #f0f2f5;
    --warn: #b45309; --danger: #b42318; --ok: #1a7f4b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  .badge { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.offline { color: var(--warn); border-color: var(--warn); }
  .badge.online { color: var(--ok); border-color: var(--ok); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 20px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input, button { font: inherit; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
  button { padding: 10px 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.link { border: 0; background: none; color: var(--accent); padding: 4px 8px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 3px solid #9bbcff; outline-offset: 1px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 4px; }
  .tabs button[aria-selected=true] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  #auth form { max-width: 380px; margin: 0 auto; }
  #auth .submit { width: 100%; margin-top: 18px; }
  .error { color: var(--danger); font-size: 14px; min-height: 1.4em; margin: 10px 0 0; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  #log { height: 60vh; min-height: 320px; overflow-y: auto; margin: 4px 0 12px; padding: 4px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.bot { align-self: flex-start; background: var(--bot); }
  .msg.sys { align-self: center; background: none; color: var(--muted); font-size: 14px; }
  .tag { display: inline-block; font-size: 12px; padding: 0 8px; margin-top: 4px; border-radius: 999px; border: 1px solid currentColor; }
  .tag.emergency { color: var(--danger); } .tag.alert { color: var(--warn); } .tag.other { color: var(--muted); }
  #form { display: flex; gap: 8px; } #text { flex: 1; min-width: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>🤖 陪伴机器人</h1>
  <span id="llm" class="badge" hidden></span>
  <span id="who" class="badge" hidden></span>
  <button id="logout" type="button" class="link" hidden>退出登录</button>
</header>

<main>
  <!-- 登录 / 注册 -->
  <section id="auth" aria-label="登录或注册" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-login" aria-selected="true">登录</button>
      <button type="button" role="tab" id="tab-register" aria-selected="false">注册</button>
    </div>

    <form id="login-form" autocomplete="on">
      <label for="l-user">用户名</label>
      <input id="l-user" name="username" autocomplete="username" maxlength="32" required>
      <label for="l-pass">密码</label>
      <input id="l-pass" name="password" type="password" autocomplete="current-password" maxlength="128" required>
      <button class="primary submit" type="submit">登录</button>
    </form>

    <form id="register-form" autocomplete="on" hidden>
      <label for="r-user">用户名（3~32 位字母、数字、下划线）</label>
      <input id="r-user" name="username" autocomplete="username" maxlength="32" required>
      <label for="r-pass">密码（至少 8 位）</label>
      <input id="r-pass" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <label for="r-name">机器人怎么称呼您</label>
      <input id="r-name" name="name" maxlength="20" required>
      <label for="r-age">年龄</label>
      <input id="r-age" name="age" type="number" min="1" max="120" inputmode="numeric" required>
      <div id="invite-box">
        <label for="r-invite">邀请码（一次性，向管理员索取）</label>
        <input id="r-invite" name="invite_code" autocomplete="off" maxlength="128">
      </div>
      <button class="primary submit" type="submit">注册并进入</button>
      <p class="hint">每个账号拥有独立的对话历史和记忆，其他用户看不到。</p>
    </form>
    <p id="auth-error" class="error" role="alert"></p>
  </section>

  <!-- 对话 -->
  <section id="chat" aria-label="对话" hidden>
    <div id="log" role="log" aria-live="polite" aria-label="对话记录"></div>
    <form id="form" autocomplete="off">
      <label class="sr-only" for="text">输入想说的话</label>
      <input id="text" type="text" maxlength="200" placeholder="想聊点什么？" required>
      <button id="send" class="primary" type="submit">发送</button>
    </form>
    <p class="hint">想修改住址、过敏史等资料：说“进入设置模式，口令……”，按提示操作；说“退出设置”返回。</p>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids) n.append(k);
  return n;
};

let me = null, busy = false, oldestId = null, hasMore = false;
const LEVEL = { observe: "关注", alert: "告警", emergency: "紧急" };

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
    credentials: "same-origin",
  });
  if (!r.ok) {
    let msg = r.statusText;
    try {
      const j = await r.json();
      if (typeof j.detail === "string") msg = j.detail;
      else if (Array.isArray(j.detail)) msg = "输入内容不符合要求，请检查后重试";
    } catch (_) {}
    throw Object.assign(new Error(msg), { status: r.status });
  }
  return r.status === 204 ? null : r.json();
}

// ---------- 视图切换 ----------
function showAuth(msg = "") {
  me = null;
  $("#auth").hidden = false; $("#chat").hidden = true;
  $("#who").hidden = true; $("#logout").hidden = true; $("#llm").hidden = true;
  $("#auth-error").textContent = msg;
  $("#log").replaceChildren();
}
function showChat(info) {
  me = info;
  $("#auth").hidden = true; $("#chat").hidden = false;
  $("#who").textContent = info.name; $("#who").hidden = false;
  $("#logout").hidden = false;
  $("#llm").hidden = false;
  $("#llm").textContent = info.llm === "online" ? "真实 LLM 对话" : "离线模板回复（未接入 LLM）";
  $("#llm").className = "badge " + (info.llm === "online" ? "online" : "offline");
  $("#text").maxLength = info.max_text;
  return loadHistory();
}
function selectTab(which) {
  const login = which === "login";
  $("#login-form").hidden = !login; $("#register-form").hidden = login;
  $("#tab-login").setAttribute("aria-selected", login);
  $("#tab-register").setAttribute("aria-selected", !login);
  $("#auth-error").textContent = "";
}

// ---------- 对话渲染 ----------
function tagFor(level, actions) {
  const parts = [];
  if (level) parts.push(LEVEL[level] || level);
  if (actions && actions.length) parts.push(actions.join("；"));
  if (!parts.length) return null;
  return { cls: level === "emergency" ? "emergency" : level === "alert" ? "alert" : "other", text: parts.join(" · ") };
}
function bubble(who, text, tag, at) {
  const box = el("div", { className: `msg ${who}` }, text);
  if (at) box.title = at;
  if (tag) box.append(el("br"), el("span", { className: `tag ${tag.cls}`, textContent: tag.text }));
  return box;
}
function scrollEnd() { const l = $("#log"); l.scrollTop = l.scrollHeight; }

async function loadHistory() {
  const log = $("#log");
  log.replaceChildren();
  const r = await api("GET", "/api/history?limit=50");
  if (!r.messages.length) {
    log.append(bubble("bot", `${me.name}，我在呢。今天感觉怎么样呀？`));
  } else {
    appendHistory(r.messages, false);
    hasMore = r.messages.length === 50;
    addMoreButton();
  }
  scrollEnd();
  $("#text").focus();
}
function appendHistory(msgs, prepend) {
  const nodes = msgs.map((m) =>
    bubble(m.role === "user" ? "user" : "bot", m.text, m.role === "assistant" ? tagFor(m.level, null) : null, m.at));
  oldestId = msgs[0].id;
  const log = $("#log");
  if (prepend) {
    const before = log.scrollHeight;
    log.prepend(...nodes);
    log.scrollTop = log.scrollHeight - before;
  } else {
    log.append(...nodes);
  }
}
function addMoreButton() {
  $("#more")?.remove();
  if (!hasMore) return;
  const b = el("button", { id: "more", type: "button", className: "link", textContent: "查看更早的对话" });
  b.addEventListener("click", async () => {
    const r = await api("GET", `/api/history?limit=50&before=${oldestId}`);
    hasMore = r.messages.length === 50;
    if (r.messages.length) appendHistory(r.messages, true);
    addMoreButton();
  });
  $("#log").prepend(b);
}

// ---------- 发送 ----------
function setBusy(b) {
  busy = b;
  $("#text").disabled = b; $("#send").disabled = b;
  if (!b) $("#text").focus();
}
async function say(text) {
  text = text.trim();
  if (!text || busy) return;
  const log = $("#log");
  log.append(bubble("user", text));
  const pending = bubble("bot", "……");
  log.append(pending);
  scrollEnd();
  setBusy(true);
  try {
    const r = await api("POST", "/api/chat", { text });
    pending.replaceWith(bubble("bot", r.reply, tagFor(r.level, r.actions)));
  } catch (e) {
    pending.remove();
    if (e.status === 401) { showAuth("登录已过期，请重新登录"); return; }
    log.append(bubble("sys", `出错了：${e.message}`));
  } finally {
    setBusy(false);
    scrollEnd();
  }
}

// ---------- 事件 ----------
$("#tab-login").addEventListener("click", () => selectTab("login"));
$("#tab-register").addEventListener("click", () => selectTab("register"));

async function submitAuth(ev, path, payload) {
  ev.preventDefault();
  const btn = ev.target.querySelector("button[type=submit]");
  btn.disabled = true; $("#auth-error").textContent = "";
  try {
    await showChat(await api("POST", path, payload));
    ev.target.reset();
  } catch (e) {
    $("#auth-error").textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}
$("#login-form").addEventListener("submit", (ev) =>
  submitAuth(ev, "/api/login", { username: $("#l-user").value.trim(), password: $("#l-pass").value }));
$("#register-form").addEventListener("submit", (ev) =>
  submitAuth(ev, "/api/register", {
    username: $("#r-user").value.trim(), password: $("#r-pass").value,
    name: $("#r-name").value.trim(), age: Number($("#r-age").value),
    invite_code: $("#r-invite").value.trim(),
  }));
$("#logout").addEventListener("click", async () => {
  try { await api("POST", "/api/logout"); } catch (_) {}
  showAuth();
});
$("#form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const t = $("#text").value;
  $("#text").value = "";
  say(t);
});

async function applyAuthConfig() {
  let mode = "invite";
  try { mode = (await api("GET", "/api/auth-config")).registration; } catch (_) {}
  $("#invite-box").hidden = mode !== "invite";
  $("#r-invite").required = mode === "invite";
}

(async function init() {
  applyAuthConfig();
  try {
    await showChat(await api("GET", "/api/me"));
  } catch (e) {
    showAuth(e.status === 401 ? "" : `启动失败：${e.message}`);
  }
})();
</script>
</body>
</html>
